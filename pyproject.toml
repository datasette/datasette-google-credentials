[project]
name = "datasette-google-auth"
version = "0.0.1a0"
description = "Google credentials for Datasette: shared service accounts and per-user OAuth connections, brokered to other plugins"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a41",
    "datasette-acl",
    "datasette-acl-share",
    "datasette-vite>=0.0.1a4",
    "datasette-plugin-router>=0.0.1a2",
    "pydantic>=2",
    "sqlite-migrate>=0.1b0",
    "sqlite-utils>=3.38",
    "python-ulid>=4",
    "pyjwt[crypto]",
    "cryptography",
    "httpx2>=2.0",
    # Declared explicitly (datasette 1.0a41 already brings it), as cron and
    # agent do. The SDK is never imported by the package (D29).
    "opentelemetry-api>=1.37",
]

[dependency-groups]
dev = [
    "datasette-debug-gotham>=0.1.0a3",
    # Hosts the vendored mock Google server in tests (ticket 06).
    "fastapi",
    # In-memory tracer/meter providers for the telemetry tests (ticket 20).
    "opentelemetry-sdk>=1.37",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
    "ty",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-google-auth"
Changelog = "https://github.com/datasette/datasette-google-auth/releases"
Issues = "https://github.com/datasette/datasette-google-auth/issues"
CI = "https://github.com/datasette/datasette-google-auth/actions"

[project.entry-points.datasette]
google_auth = "datasette_google_auth"

# Editable, path-based sibling checkouts. ../datasette-acl must be on a branch
# that has the datasette_acl.grants Principal API
# (`grant(..., principal=Principal.actor(id), role=...)`): `main` has it and
# `grant-event` (currently checked out) adds parent-only grants and acl-grant
# events on top. The PyPI 0.6a1 release does not. The editable install tracks
# the working tree, so a `git checkout` there changes what we develop against.
[tool.uv.sources]
datasette-acl = { path = "../datasette-acl", editable = true }
datasette-acl-share = { path = "../datasette-acl-share", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
datasette_google_auth = ["static/**/*", "templates/*", "manifest.json"]

[tool.setuptools.packages.find]
# Whitelist the package we ship (see datasette-cron: an exclude-based list
# lets setuptools recurse into build/lib/ from earlier builds).
include = ["datasette_google_auth*"]

[tool.ty.src]
exclude = ["tests/", "samples/", "frontend/"]

# The editable path sources above install through a setuptools import-hook
# finder, which ty can't follow; point it at the same checkouts.
[tool.ty.environment]
extra-paths = ["../datasette-acl", "../datasette-acl-share"]

# Keep the formatter out of Markdown (ruff 0.16 formats code blocks in .md).
[tool.ruff.format]
exclude = ["*.md"]

# Explicit select rather than extend-select, so a floor-only ruff pin gives
# CI and local checkouts the same idea of "clean".
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
